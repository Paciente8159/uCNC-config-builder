<div
		ng-hide="DYNAMIC['ENABLE_PARSER_MODULES'] && !DYNAMIC['DISABLE_SETTINGS_MODULES'] && DYNAMIC['ENABLE_MAIN_LOOP_MODULES'] && DYNAMIC['MODULES']['sd_card_v2']">
		<button type="button" class="btn btn-outline-warning"
			ng-click="DYNAMIC['ENABLE_PARSER_MODULES']=true;DYNAMIC['ENABLE_MAIN_LOOP_MODULES']=true;DYNAMIC['DISABLE_SETTINGS_MODULES']=false; DYNAMIC['MODULES']['sd_card_v2']=true;SD_CARD_INTERFACE=SD_CARD_HW_CUSTOM;SD_CARD_INTERFACE='SD_CARD_HW_CUSTOM';">Enable
			required extension options</button>
	</div>
	<input hidden class="form-check-input" type="checkbox" id="SD_CARD_CUSTOM_HW_DRIVER"
			ng-model="SD_CARD_CUSTOM_HW_DRIVER" config-file="hal" ng-init="SD_CARD_CUSTOM_HW_DRIVER=true;">
